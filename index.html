<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACM Orphanage Event Registration</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="registration-page">
    <section class="registration-card" aria-labelledby="page-title">
      <div class="card-accent" aria-hidden="true"></div>
      <div class="logo"><img src="acmlogo-transparent.png" alt="ACM logo"></div>
      <p class="organization">Bahria University Karachi</p>
      <h1 id="page-title">Orphanage Event Registration</h1>
      <p class="intro">Reserve your place for the ACM Student Chapter orphanage event.</p>
      <div class="availability" id="registrationStatus"><span class="status-dot"></span><strong>Registration is open</strong></div>

      <form id="registrationForm" novalidate>
        <div class="form-grid">
        <label class="field" for="name">
          <span>Full name <b>Required</b></span>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Enter your full name" required>
        </label>
        <label class="field" for="enrollment">
          <span>Enrollment number <b>Required</b></span>
          <input id="enrollment" name="enrollment" type="text" autocomplete="off" placeholder="Enter your enrollment number" required>
        </label>
        </div>
        <label class="field" for="phone">
          <span>Phone number <b>Required</b></span>
          <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="Enter your phone number" required>
        </label>
        <div class="form-grid">
        <label class="field" for="department">
          <span>Department <b>Required</b></span>
          <select id="department" name="department" required>
            <option value="" selected disabled>Select your department</option>
            <option value="BS Computer Science">BS Computer Science</option>
            <option value="BS Information Technology">BS Information Technology</option>
            <option value="BS Artificial Intelligence">BS Artificial Intelligence</option>
            <option value="Bachelor of Software Engineering">Bachelor of Software Engineering (BSE)</option>
            <option value="Bachelor of Computer Engineering">Bachelor of Computer Engineering (BCE)</option>
            <option value="BS Business Analytics">BS Business Analytics</option>
            <option value="Bachelor of Business Administration">Bachelor of Business Administration (BBA)</option>
            <option value="BS Accounting and Finance">BS Accounting &amp; Finance</option>
          </select>
        </label>
        <label class="field" for="semester">
          <span>Semester <b>Required</b></span>
          <select id="semester" name="semester" required>
            <option value="" selected disabled>Select your semester</option>
            <option value="1">Semester 1</option>
            <option value="2">Semester 2</option>
            <option value="3">Semester 3</option>
            <option value="4">Semester 4</option>
            <option value="5">Semester 5</option>
            <option value="6">Semester 6</option>
            <option value="7">Semester 7</option>
            <option value="8">Semester 8</option>
          </select>
        </label>
        </div>
        <button type="submit"><span>Register now</span><span aria-hidden="true">&#8594;</span></button>
        <div id="formMessage" class="form-message" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
