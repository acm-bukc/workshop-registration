<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACM Student Chapter Registration</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="registration-page">
    <section class="registration-card" aria-labelledby="page-title">
      <div class="card-accent" aria-hidden="true"></div>
      <div class="logo"><img src="acmlogo-transparent.png" alt="ACM logo"></div>
      <p class="organization">Bahria University Karachi</p>
      <h1 id="page-title">Student Registration</h1>
      <p class="intro">Reserve your place at the next ACM Student Chapter session.</p>
      <div class="availability" id="registrationStatus"><span class="status-dot"></span><strong>Registration is open</strong></div>

      <form id="registrationForm" novalidate>
        <label class="field" for="name">
          <span>Full name <b>Required</b></span>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Enter your full name" required>
        </label>
        <label class="field" for="enrollment">
          <span>Enrollment number <b>Required</b></span>
          <input id="enrollment" name="enrollment" type="text" autocomplete="off" placeholder="Enter your enrollment number" required>
        </label>
        <label class="field" for="phone">
          <span>Phone number <b>Required</b></span>
          <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="Enter your phone number" required>
        </label>
        <label class="field" for="department">
          <span>Department <b>Required</b></span>
          <select id="department" name="department" required>
            <option value="" selected disabled>Select your department</option>
            <option>Computer Science</option>
            <option>Information Technology</option>
            <option>Artificial Intelligence</option>
          </select>
        </label>
        <label class="field" for="linkedin">
          <span>LinkedIn profile <b>Optional</b></span>
          <input id="linkedin" name="linkedin" type="url" autocomplete="url" placeholder="https://linkedin.com/in/your-name">
        </label>
        <button type="submit"><span>Register now</span><span aria-hidden="true">&#8594;</span></button>
        <div id="formMessage" class="form-message" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
